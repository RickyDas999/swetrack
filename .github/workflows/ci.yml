name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Mirrors the Dockerfile: install the CPU-only torch build first, since
      # sentence-transformers otherwise pulls in the much larger default
      # PyPI wheel with CUDA runtime deps this runner never uses.
      - name: Install CPU-only torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
