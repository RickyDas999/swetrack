[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swetrack"
version = "0.1.0"
description = "Personalized ML platform for new-grad SWE recruiting and interview preparation: opportunity ranking, application/interview tracking, and skill mastery."
requires-python = ">=3.11,<3.12"
readme = "README.md"

dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7.0",
    "pandas>=2.1,<2.3",
    "numpy>=1.26,<2.0",
    "scikit-learn>=1.4,<1.6",
    "sentence-transformers>=2.7,<3.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "mlflow>=2.12,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "pypdf>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
